[package]
name = "codex-harness-translator"
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
process = { package = "process-library", git = "https://github.com/LiGoldragon/process-library", rev = "63bca61d040830d2c409c91a3a93a4bd934c75ff", features = ["datom"] }
codex-harness-process = { path = "../codex-harness-process", features = ["datom"] }
transport = { path = "../transport" }
harness = { package = "harness-nexus-library", git = "https://github.com/LiGoldragon/harness-nexus-library", rev = "ae7e008700972b7f033de6ba94c36e6c49fc93f8", features = ["datom"] }
datom-codec = { workspace = true }
protos = { workspace = true }
rustix = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
signal-harness = { git = "https://github.com/LiGoldragon/signal-harness", rev = "f302b3088c719a3df1991b7701899dea7dce7288", features = ["datom"] }

[lints.rust]
unsafe_code = "forbid"
