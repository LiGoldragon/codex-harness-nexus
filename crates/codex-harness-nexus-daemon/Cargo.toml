[package]
name = "codex-harness-nexus-daemon"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/codex-harness-nexus"
publish = false

[dependencies]
codex-harness-nexus = { version = "0.2.0", path = "../codex-harness-nexus" }
harness.workspace = true
signal.workspace = true
signal-codex-harness-nexus.workspace = true
meta-signal-codex-harness-nexus.workspace = true
nexus-exchange.workspace = true
nexus-serving.workspace = true
kameo.workspace = true
shared-translator.workspace = true
tokio.workspace = true
nix.workspace = true

[dev-dependencies]
flow.workspace = true

# The daemon: it reads its bootstrap from the pair launcher and serves the
# Nexus.
[[bin]]
name = "codex-harness-nexus"
path = "src/main.rs"

[lints]
workspace = true
