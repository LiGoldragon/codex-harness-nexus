[package]
name = "codex-harness-nexus"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/codex-harness-nexus"
publish = false

[features]
default = []
datom = ["dep:datom-codec", "dep:protos", "harness/datom", "flow/datom", "signal/datom", "signal-codex-harness-nexus/datom", "meta-signal-codex-harness-nexus/datom"]

[dependencies]
harness.workspace = true
flow.workspace = true
signal.workspace = true
signal-codex-harness-nexus.workspace = true
meta-signal-codex-harness-nexus.workspace = true
nexus.workspace = true
memory-engine.workspace = true
rkyv.workspace = true
datom-codec = { workspace = true, optional = true }
protos = { workspace = true, optional = true }

[lints]
workspace = true
