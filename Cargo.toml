[workspace]
resolver = "3"
members = ["codex-harness-process", "transport", "codex-harness-nexus", "codex-harness-translator", "codex-harness-selector-control"]

[workspace.dependencies]
rkyv = { version = "0.8", default-features = false, features = ["alloc", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526" }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "c93b598" }
rustix = { version = "1", features = ["net", "fs", "event"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
