[workspace]
members = ["crates/codex-harness-nexus", "crates/codex-harness-translator"]
resolver = "2"

[workspace.dependencies]
harness = { package = "harness-nexus-library", git = "https://github.com/LiGoldragon/harness-nexus-library", rev = "3613d63d0994de7841bcf6f070c83bebb0ddfa5a", default-features = false }
flow = { package = "flow-ethos", git = "https://github.com/LiGoldragon/flow", rev = "062ef9e1", default-features = false }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "4f5cbb9", default-features = false }
signal-codex-harness-nexus = { git = "https://github.com/LiGoldragon/signal-codex-harness-nexus", rev = "8bd9dc670b8103adcabf447b70d3a4fc195df7a5", default-features = false }
meta-signal-codex-harness-nexus = { git = "https://github.com/LiGoldragon/meta-signal-codex-harness-nexus", rev = "8a504bc80b12d7f75860c276f64e06f387df3ba0", default-features = false }
nexus = { git = "https://github.com/LiGoldragon/nexus", rev = "d020a62", default-features = false }
memory-engine = { git = "https://github.com/LiGoldragon/memory-engine", rev = "3261088" }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526" }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "c93b598" }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
