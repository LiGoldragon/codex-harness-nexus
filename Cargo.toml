[workspace]
members = ["crates/codex-harness-nexus", "crates/codex-harness-translator", "crates/codex-harness-nexus-daemon"]
resolver = "2"

[workspace.dependencies]
harness = { package = "harness-nexus-library", git = "https://github.com/LiGoldragon/harness-nexus-library", rev = "3613d63d0994de7841bcf6f070c83bebb0ddfa5a", default-features = false }
flow = { package = "flow-ethos", git = "https://github.com/LiGoldragon/flow", rev = "062ef9e1", default-features = false }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "4f5cbb9", default-features = false }
signal-codex-harness-nexus = { git = "https://github.com/LiGoldragon/signal-codex-harness-nexus", rev = "68dafec69a6f733cbee74a7a990b9aeffd0c4873", default-features = false }
meta-signal-codex-harness-nexus = { git = "https://github.com/LiGoldragon/meta-signal-codex-harness-nexus", rev = "b6039b70491a2b4b778af4b094c3b5782da2964e", default-features = false }
nexus = { git = "https://github.com/LiGoldragon/nexus", rev = "24804e89416fd64644355527ee219d7a40d3462e", default-features = false }
nexus-exchange = { git = "https://github.com/LiGoldragon/nexus", rev = "a4bc0113c10c34ec9d92cde2d650eca9324144db", default-features = false }
nexus-serving = { git = "https://github.com/LiGoldragon/nexus", rev = "a4bc0113c10c34ec9d92cde2d650eca9324144db", default-features = false }
shared-translator = { package = "translator", git = "https://github.com/LiGoldragon/translator", rev = "29601a3", default-features = false, features = ["unix"] }
translator-client = { git = "https://github.com/LiGoldragon/translator", rev = "2739d586e1455a001661fc85a8a61b6219aa99df", default-features = false }
translator-serving = { git = "https://github.com/LiGoldragon/translator", rev = "2739d586e1455a001661fc85a8a61b6219aa99df", default-features = false }
memory-engine = { git = "https://github.com/LiGoldragon/memory-engine", rev = "3261088" }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526" }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "c93b598" }
serde_json = "1"
notify = "8.2.0"
nix = { version = "0.30", features = ["fs", "poll", "user"] }
# The base builds these with the union of their consumers' features; the
# edge to those features is carried here, as the base asks.
tokio = { version = "1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time", "tracing"] }
futures-channel = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
mio = { version = "1.2.3", features = ["log", "net", "os-ext", "os-poll"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await-macro", "channel", "io", "sink"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
